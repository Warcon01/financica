<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Financica</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card p-4 shadow-lg" style="width: 350px;">
                <h2 class="text-center mb-4" id="authTitle">Log In</h2>
                <form id="authForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit</button>
                </form>
                <p class="text-center mt-3">
                    <a href="#" id="toggleAuth">Sign up</a>
                </p>
                <a href="index.html" class="btn btn-secondary w-100 mt-3">Return to Home</a>
            </div>
        </div>
    
        <script>
            // Toggle between "Log In" and "Sign Up" text
            document.getElementById("toggleAuth").addEventListener("click", function (event) {
                event.preventDefault();
                let title = document.getElementById("authTitle");
                this.textContent = (title.textContent === "Log In") ? "Log In" : "Sign up";
                title.textContent = (title.textContent === "Log In") ? "Sign Up" : "Log In";
            });
        </script>
    </body>
     
</html>
